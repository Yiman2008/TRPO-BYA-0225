name: Tag shop milestones
on:
  push:
    branches: [main]
    paths: ['shop/docs/milestones.txt', '.github/workflows/shop-tags.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable milestone tags
        shell: bash
        run: |
          set -euo pipefail
          while read -r tag commit; do
            [[ -n "$tag" ]] || continue
            git check-ref-format "refs/tags/$tag"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$commit^{commit}"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "refs/tags/$tag")" = "$commit"
            else
              git tag "$tag" "$commit"
              git push origin "refs/tags/$tag"
            fi
          done < shop/docs/milestones.txt
